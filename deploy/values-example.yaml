# Example overlay: helm upgrade --install radiopath deploy/chart -f deploy/values-example.yaml --set image.tag=<tag>
image:
  repository: ghcr.io/radiopath/radiopath

envFromSecret: radiopath-env

env:
  RADIOPATH_BASE_URL: https://radiopath.example.org
  RADIOPATH_SMTP_HOST: smtp.example.org
  RADIOPATH_SMTP_USER: radiopath@example.org
  RADIOPATH_MAIL_FROM: radiopath@example.org
  RADIOPATH_DEM_S3_ENDPOINT: https://s3.example.org
  RADIOPATH_DEM_S3_BUCKET: radiopath-dem

ingress:
  hosts:
    - radiopath.example.org
    - www.radiopath.example.org
  canonicalHost: radiopath.example.org

worker:
  autoscaling:
    enabled: true
