{{- if and .Values.ingress.enabled .Values.ingress.canonicalHost }}
{{- $others := without .Values.ingress.hosts .Values.ingress.canonicalHost }}
{{- if $others }}
{{- $issuer := .Values.ingress.tls.clusterIssuer }}
{{- $secretName := .Values.ingress.tls.secretName }}
{{- if and (not $secretName) $issuer }}{{ $secretName = printf "%s-redirect-tls" .Release.Name }}{{ end }}
{{- $annotations := deepCopy .Values.ingress.annotations }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-canonical@kubernetescrd" .Release.Namespace .Release.Name) }}
{{- with $issuer }}{{ $_ := set $annotations "cert-manager.io/cluster-issuer" . }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-redirect
  labels:
    {{- include "radiopath.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $others }}
        - {{ . | quote }}
        {{- end }}
      {{- with $secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    {{- range $others }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  name: http
    {{- end }}
{{- end }}
{{- end }}
