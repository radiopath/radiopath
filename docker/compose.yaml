# name: without it Compose derives the project name from the docker/ directory and the volumes move.
name: radiopath

services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: radiopath
      POSTGRES_PASSWORD: radiopath
      POSTGRES_DB: radiopath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "radiopath"]
      interval: 1s
      retries: 30

  valkey:
    image: valkey/valkey:9.1-alpine
    command: ["valkey-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6380:6379"

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "1025:1025"
      - "8025:8025"

  # Node for the Makefile (SPA build, check, API types); never started by up.
  node:
    image: node:26-alpine
    profiles: [tools]
    working_dir: /src
    environment:
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ..:/src

  # Vite dev server of make dev; the proxy reaches the Go server on the host.
  vite:
    image: node:26-alpine
    profiles: [tools]
    working_dir: /src/web
    command: ["npx", "vite", "dev", "--host", "0.0.0.0", "--strictPort"]
    environment:
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      BACKEND: http://host.docker.internal:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "5173:5173"
    volumes:
      - ..:/src

  # make e2e: the image packing the CI binary against its own database (fresh every run) and mail catcher; Playwright joins this network
  e2e-db:
    profiles: [e2e]
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: radiopath
      POSTGRES_PASSWORD: radiopath
      POSTGRES_DB: radiopath
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "radiopath"]
      interval: 1s
      retries: 30

  e2e-mail:
    profiles: [e2e]
    image: axllent/mailpit:v1.31.5

  e2e-app:
    profiles: [e2e]
    build:
      context: ../bin
      dockerfile: ../docker/ci.Dockerfile
    depends_on:
      e2e-db:
        condition: service_healthy
      e2e-mail:
        condition: service_started
    environment:
      DATABASE_URL: postgres://radiopath:radiopath@e2e-db:5432/radiopath
      RADIOPATH_DATASET_DIR: /data
      # no NOAA download from the test stack; hf.spec.js expects a server without sunspot data
      RADIOPATH_SUNSPOT_URL: ""
      RADIOPATH_METRICS_LISTEN: ""
      RADIOPATH_WORKERS: "1"
      RADIOPATH_LOG_LEVEL: warn
      RADIOPATH_REGISTRATION: "true"
      RADIOPATH_SMTP_HOST: e2e-mail
      RADIOPATH_SMTP_PORT: "1025"
      RADIOPATH_SMTP_STARTTLS: "false"
      RADIOPATH_MAIL_FROM: radiopath@example.test
      RADIOPATH_BASE_URL: http://e2e-app:8080
      RADIOPATH_ADMIN_TOKEN: e2e-only-admin-token-not-a-secret-1234
    volumes:
      - ../tmp/testfiles:/data:ro

volumes:
  pgdata:
