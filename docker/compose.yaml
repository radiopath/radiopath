# name: without it Compose derives the project name from the docker/ directory and the volumes move.
name: radiopath

services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: radiopath
      POSTGRES_PASSWORD: radiopath
      POSTGRES_DB: radiopath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
