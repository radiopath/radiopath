name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch cancels the running workflow; tag runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # A cache per job and arch: setup-go's shared one is saved by whichever job ends first and fits the others'
      # flags (-race, -trimpath, GOARCH) poorly. Saved again only when go.mod or go.sum change.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ github.job }}-
      # go:embed needs dist; the SPA build itself is the web job's.
      - run: mkdir -p internal/webui/dist && touch internal/webui/dist/index.html
      - run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go run ./cmd/radiopath openapi | cmp - web/openapi.json || { echo "web/openapi.json is stale, run 'make api' and commit"; exit 1; }
      # ITU data set for the HF model tests (pinned and checksummed); without it they would skip, so require it.
      - uses: actions/cache@v6
        with:
          path: tmp/testfiles/hf1
          key: hf-data-${{ hashFiles('scripts/fetch-hf-data.sh', 'internal/hf/data.sha256') }}
      - run: scripts/fetch-hf-data.sh
      - run: go test -race ./...
        env:
          HF_REQUIRE_DATA: "1"

  # The committed HF reference reports must still be what the unmodified ITU C program writes: build it from the pinned
  # upstream sources and compare. A separate job, so a toolchain problem never blocks the Go tests.
  hf-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ITU-R-Study-Group-3/ITU-R-HF
          ref: 82017594a1c6cacfaa7e86954c4ae7b3a5825a3d
          path: tmp/itu
          sparse-checkout: |
            P533/Src
            P372/Src
            ITURHFProp/Src
      - uses: actions/cache@v6
        with:
          path: tmp/testfiles/hf1
          key: hf-data-${{ hashFiles('scripts/fetch-hf-data.sh', 'internal/hf/data.sha256') }}
      - run: scripts/fetch-hf-data.sh
      - run: internal/hf/testdata/check-reference.sh tmp/itu tmp/testfiles/hf1

  # Known vulnerabilities in code paths we call; not a need of docker-image, so a new report does not block releases.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # A cache per job and arch: setup-go's shared one is saved by whichever job ends first and fits the others'
      # flags (-race, -trimpath, GOARCH) poorly. Saved again only when go.mod or go.sum change.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ github.job }}-
      - run: mkdir -p internal/webui/dist && touch internal/webui/dist/index.html
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  funcdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/funcdoc.py

  # Type check and build run as two jobs, so binary and e2e do not wait for svelte-check.
  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run api
      - run: git diff --exit-code src/lib/api.gen.ts || { echo "api.gen.ts is stale, run 'make api' and commit"; exit 1; }
      - run: npm run check
      - run: npm run lint || { echo "run 'make format' and commit"; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: webui
          path: internal/webui/dist/
          retention-days: 1

  # These binaries are what e2e tests, what docker-image ships and what release attaches.
  binary:
    runs-on: ubuntu-latest
    needs: web
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs the full history with tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # A cache per job and arch: setup-go's shared one is saved by whichever job ends first and fits the others'
      # flags (-race, -trimpath, GOARCH) poorly. Saved again only when go.mod or go.sum change.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ github.job }}-${{ matrix.arch }}-
      - uses: actions/download-artifact@v8
        with:
          name: webui
          path: internal/webui/dist/
      - run: make VERSION="$(git describe --tags --always)" bin/radiopath-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: radiopath-linux-${{ matrix.arch }}
          path: bin/radiopath-linux-${{ matrix.arch }}
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: binary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: radiopath-linux-amd64
          path: bin/
      - run: chmod +x bin/radiopath-linux-amd64 && make e2e-run
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7

  docker-image:
    runs-on: ubuntu-latest
    needs: [go, funcdoc, web-check, e2e, binary]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: radiopath-linux-*
          path: bin/
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      # Every run packs its own binaries: their version comes from git describe of that run, so a main run
      # before the tag push would ship the wrong version. main moves :staging, a tag :X.Y.Z and :latest.
      - run: |
          chmod +x bin/radiopath-linux-*
          sha="$IMAGE:${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags=(-t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest")
          else
            tags=(-t "$IMAGE:staging")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/ci.Dockerfile -t "$sha" "${tags[@]}" --push bin

  # A GitHub release with the changelog section of the version and the binaries.
  release:
    runs-on: ubuntu-latest
    needs: [docker-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: radiopath-linux-*
          path: dist/
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, "## [") == 1 { p = index($0, h) == 1; next } p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No changelog section found for version $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
